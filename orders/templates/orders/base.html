<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Boxwise{% endblock %}</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172333;background:#f3f6fa;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}.top{background:#132c46;color:white;padding:18px max(calc((100% - 1040px)/2),24px);font-weight:700;letter-spacing:.04em}
    main{max-width:1040px;margin:42px auto;padding:0 24px}.hero{margin-bottom:28px}.eyebrow{color:#317a70;text-transform:uppercase;font-size:.75rem;font-weight:700;letter-spacing:.12em}
    h1{font-size:2.25rem;margin:.35rem 0 .6rem}p{line-height:1.6;color:#536274}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:22px}
    .card{background:#fff;border:1px solid #e0e6ed;border-radius:12px;padding:24px;box-shadow:0 8px 24px #132c4608}h2{font-size:1.1rem;margin:0 0 18px}
    label{display:block;font-weight:650;margin-bottom:8px}textarea{width:100%;font:inherit;border:1px solid #cbd5df;border-radius:8px;padding:12px;resize:vertical}button,.button{background:#176b60;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;display:inline-block;margin-top:14px}
    .help{font-size:.88rem;margin:8px 0 0}.errors{color:#a42f36;background:#fff2f1;padding:12px 12px 12px 32px;border-radius:8px}.stats{display:flex;gap:10px;margin-top:20px}.stat{background:#eef5f4;border-radius:8px;padding:12px 16px}.stat strong{display:block;font-size:1.3rem}.muted{font-size:.88rem;color:#778494}.order{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f3;color:inherit;text-decoration:none}.order:last-child{border-bottom:0}.badge{color:#176b60;font-weight:700}.item-list{padding-left:20px}.result{border-left:4px solid #176b60;padding:10px 15px;background:#eef5f4;border-radius:0 8px 8px 0;margin:18px 0}.result.none{border-color:#c4862c;background:#fff7e8}
    @media(max-width:700px){main{margin:26px auto}.layout{grid-template-columns:1fr}h1{font-size:1.8rem}}
  </style>
</head>
<body><header class="top">BOXWISE <span style="font-weight:400;opacity:.75">/ warehouse tools</span></header>
<main>{% block content %}{% endblock %}</main></body>
</html>
